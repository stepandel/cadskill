<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  /* Layout: the model fills the page. A wordmark and a readout sit in the top corners, one dock of controls at the bottom. */
  :root {
    --paper: #e9edf1;
    --panel: #f7f9fa;
    --ink: #17212b;
    --muted: #586573;
    --rule: #cfd7df;
    --accent: #1b5fc9;
    --accent-ink: #ffffff;
    --model: #8d9aa8;
    --bad: #b3261e;
    --display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #11161b;
      --panel: #19212a;
      --ink: #e4eaf0;
      --muted: #94a2b0;
      --rule: #2b3642;
      --accent: #6ea8ff;
      --accent-ink: #0b1420;
      --model: #9aa8b6;
      --bad: #ff8a80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #11161b;
    --panel: #19212a;
    --ink: #e4eaf0;
    --muted: #94a2b0;
    --rule: #2b3642;
    --accent: #6ea8ff;
    --accent-ink: #0b1420;
    --model: #9aa8b6;
    --bad: #ff8a80;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.45 var(--body);
    overflow: hidden;
  }
  button, .filebtn {
    font: 500 13px/1 var(--body);
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 8px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover, .filebtn:hover { border-color: var(--accent); }
  button:focus-visible, .filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .filebtn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); position: relative; display: inline-block; }
  .filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }

  /* The model fills the page; everything else floats over it. */
  main { position: fixed; inset: 0; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  h1 {
    position: absolute; left: 24px; top: 24px; margin: 0;
    font: 600 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    pointer-events: none;
  }
  #readout {
    position: absolute; right: 24px; top: 22px; max-width: min(60vw, 520px);
    text-align: right; font: 400 12px/1.6 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted);
    overflow-wrap: anywhere; pointer-events: none;
  }
  #r-size { color: var(--ink); }

  #dock {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    max-width: calc(100vw - 32px);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px;
    padding: 8px 8px 8px 16px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
  }
  .part { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .chip { width: 10px; height: 10px; border-radius: 2px; flex: none; background: var(--model); border: 1px solid var(--rule); }
  #name { font: 400 13px/1.2 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
  .sep { width: 1px; height: 20px; background: var(--rule); }
  .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

  #status {
    position: absolute; left: 16px; right: 16px; bottom: 96px;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px;
    font: 400 12px/1.4 var(--mono); color: var(--muted);
    pointer-events: none;
  }
  #status .msg { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 10px; }
  #status .msg.bad { color: var(--bad); border-color: var(--bad); }
  #meter { width: 160px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
  #meter i { display: block; height: 100%; width: 0; background: var(--accent); }
  #drop {
    position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: 8px;
    display: none; align-items: center; justify-content: center;
    font: 600 16px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);
    background: color-mix(in srgb, var(--paper) 80%, transparent);
    pointer-events: none;
  }
  main.dragging #drop { display: flex; }
  [hidden] { display: none !important; }

  @media (max-width: 720px) {
    .sep { display: none; }
    #dock { bottom: 16px; padding: 8px; }
    #status { bottom: 124px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
</head>
<body>
<main id="main">
  <div id="stage"></div>
  <h1>CAD Bench</h1>
  <div id="readout" aria-live="polite"><div id="r-size">&nbsp;</div><div id="r-meta">&nbsp;</div></div>
  <div id="drop">Drop a STEP file to open it</div>
  <div id="status"><span class="msg" id="msg">Loading the geometry kernel</span><span id="meter"><i></i></span></div>
  <div id="dock">
    <div class="part"><span class="chip" id="chip"></span><span id="name">Sample part</span></div>
    <span class="sep"></span>
    <div class="tools">
      <button type="button" id="fit">Fit view</button>
      <button type="button" id="edges" aria-pressed="true">Edges</button>
      <label class="filebtn">Open STEP file<input type="file" id="file" accept=".step,.stp,.STEP,.STP"></label>
    </div>
  </div>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/three/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ---------- viewer ---------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 10000);
camera.up.set(0, 0, 1);                       // CAD convention: Z is up
camera.position.set(90, -120, 80);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = false;
scene.add(new THREE.HemisphereLight(0xffffff, 0x5a6470, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
camera.add(key); key.position.set(-0.6, 0.9, 1);
scene.add(camera);
const model = new THREE.Group();
scene.add(model);

let queued = false;
function draw() { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; renderer.render(scene, camera); }); }
controls.addEventListener('change', draw);
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  draw();
}
new ResizeObserver(resize).observe(stage);

function applyTheme() {
  scene.background = new THREE.Color(css('--paper'));
  const edge = new THREE.Color(css('--ink'));
  for (const p of parts) { p.lines.material.color.copy(edge); paint(p); }
  draw();
}
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* ---------- model state ---------- */
let parts = [];          // { name, path, mesh, lines, size, volume, approx, triangles, base, box }
let selected = null;
let showEdges = true;

function paint(p) {
  const on = p === selected;
  p.mesh.material.color.copy(on ? new THREE.Color(css('--accent')) : p.base);
}

function clearModel() {
  for (const p of parts) { p.mesh.geometry.dispose(); p.mesh.material.dispose(); p.lines.geometry.dispose(); p.lines.material.dispose(); }
  model.clear(); parts = []; selected = null;
}

function addPart(d) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(d.positions, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(d.normals, 3));
  g.setIndex(new THREE.BufferAttribute(d.indices, 1));
  g.computeBoundingBox();
  const base = d.color ? new THREE.Color().setRGB(d.color[0], d.color[1], d.color[2], THREE.SRGBColorSpace) : new THREE.Color(css('--model'));
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: base, metalness: 0.1, roughness: 0.62, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
  const lines = new THREE.LineSegments(new THREE.EdgesGeometry(g, 28), new THREE.LineBasicMaterial({ color: css('--ink'), transparent: true, opacity: 0.55 }));
  lines.visible = showEdges;
  mesh.add(lines);
  model.add(mesh);
  const p = { name: d.name, path: d.path, mesh, lines, size: d.size, volume: d.volume, approx: d.approx, triangles: d.triangles, base, box: g.boundingBox };
  mesh.userData.part = p;
  parts.push(p);
  return p;
}

function fit() {
  const box = new THREE.Box3();
  for (const p of parts) box.union(p.box);
  if (box.isEmpty()) return;
  const s = box.getBoundingSphere(new THREE.Sphere());
  const dir = camera.position.clone().sub(controls.target).normalize();
  const half = THREE.MathUtils.degToRad(camera.fov) / 2;                       // vertical half-angle
  const narrow = Math.min(half, Math.atan(Math.tan(half) * camera.aspect));   // the tighter of vertical and horizontal, so tall windows fit too
  const dist = s.radius / Math.sin(narrow) * 1.08;
  controls.target.copy(s.center);
  camera.position.copy(s.center).addScaledVector(dir, dist);
  camera.near = Math.max(dist / 500, 0.01); camera.far = dist * 20; camera.updateProjectionMatrix();
  controls.update(); draw();
}

/* ---------- readout and dock ---------- */
const mm = (v) => (v >= 100 ? v.toFixed(1) : v.toFixed(2));
const dims = (v) => mm(v[0]) + ' × ' + mm(v[1]) + ' × ' + mm(v[2]) + ' mm';
const volume = (p) => (p.approx ? '≈ ' : '') + (p.volume / 1000).toFixed(p.volume < 10000 ? 3 : 2) + ' cm³';
let sourceName = 'Sample part';

// Top-right readout and the dock label describe the selected part, the only part, or the whole assembly.
function describe() {
  const p = selected || (parts.length === 1 ? parts[0] : null);
  const tris = parts.reduce((a, q) => a + q.triangles, 0);
  if (p) {
    $('r-size').textContent = p.size ? dims(p.size) : ' ';
    $('r-meta').textContent = (p.volume ? volume(p) + '  ·  ' : '') + p.triangles.toLocaleString() + ' triangles';
    $('name').textContent = p.name; $('name').title = (p.path.length ? p.path.join(' / ') + ' / ' : '') + p.name;
    $('chip').style.background = '#' + p.base.getHexString();
  } else if (parts.length) {
    const box = new THREE.Box3();
    for (const q of parts) box.union(q.box);
    const s = box.getSize(new THREE.Vector3());
    $('r-size').textContent = dims([s.x, s.y, s.z]);
    $('r-meta').textContent = parts.length + ' parts  ·  ' + tris.toLocaleString() + ' triangles';
    $('name').textContent = sourceName; $('name').title = sourceName;
    $('chip').style.background = '';
  } else {
    $('r-size').textContent = ' '; $('r-meta').textContent = ' ';
    $('name').textContent = sourceName; $('name').title = sourceName;
    $('chip').style.background = '';
  }
}
function select(p) {
  const prev = selected; selected = p;
  if (prev) paint(prev);
  if (p) paint(p);
  describe(); draw();
}

/* ---------- picking ---------- */
const ray = new THREE.Raycaster();
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const hit = ray.intersectObjects(parts.map((p) => p.mesh), false)[0];
  select(hit ? hit.object.userData.part : null);
});

/* ---------- kernel worker ---------- */
const msg = $('msg'), meter = $('meter');
function say(text, bad) { msg.textContent = text; msg.classList.toggle('bad', !!bad); msg.hidden = false; }
function quiet() { msg.hidden = true; }   // once a model is up, the readout carries the numbers
let worker = null, ready = false, job = 0, stepName = '';
try {
  worker = new Worker(new URL('./cad-worker.js', import.meta.url), { type: 'module' });
} catch (e) {
  say('This browser could not start the geometry kernel: ' + e.message, true); meter.hidden = true;
}
if (worker) {
  worker.onerror = (e) => { say('The geometry kernel stopped: ' + (e.message || 'unknown error'), true); meter.hidden = true; };
  worker.onmessage = (ev) => {
    const m = ev.data;
    if (m.type === 'boot') {
      meter.firstElementChild.style.width = Math.round((m.loaded / m.total) * 100) + '%';
      say('Loading the geometry kernel  ' + (m.loaded / 1048576).toFixed(1) + ' / ' + (m.total / 1048576).toFixed(1) + ' MB');
    } else if (m.type === 'ready') {
      ready = true; meter.hidden = true;
      requestPlate();
    } else if (m.type === 'fatal') {
      say(m.message, true); meter.hidden = true;
    } else if (m.type === 'progress') {
      if (m.id !== job) return;
      say(m.stage === 'reading' ? 'Reading ' + stepName + ' (large files take a few seconds)' : 'Meshing part ' + m.parts);
    } else if (m.type === 'error') {
      if (m.id !== job) return;
      say('Could not build this model: ' + m.message, true);
    } else if (m.type === 'result') {
      if (m.id === job) show(m);
    }
  };
}

function show(m) {
  clearModel();
  for (const d of m.parts) addPart(d);
  if (m.kind === 'step') sourceName = stepName;
  quiet(); select(null); fit();
}

/* ---------- sample part ---------- */
// Shown until a STEP file is opened: a 40 × 24 × 6 mm mounting plate with 4 mm corners and an 8 mm hole.
const PLATE = { length: 40, width: 24, thickness: 6, hole: 8, corner: 4 };
function requestPlate() {
  if (!ready || !worker) return;
  worker.postMessage({ type: 'plate', id: ++job, params: PLATE });
}

/* ---------- opening STEP files ---------- */
async function openFile(file) {
  if (!file) return;
  if (!/\.(step|stp)$/i.test(file.name)) { say('"' + file.name + '" is not a STEP file. Choose a .step or .stp file.', true); return; }
  if (!ready) { say('The kernel is still loading. Try again in a moment.', true); return; }
  stepName = file.name;
  say('Reading ' + file.name);
  let text;
  try { text = await file.text(); } catch (e) { say('Could not read ' + file.name + ': ' + e.message, true); return; }
  worker.postMessage({ type: 'step', id: ++job, text });
}
$('file').addEventListener('change', (e) => { openFile(e.target.files[0]); e.target.value = ''; });
const main = $('main');
let dragDepth = 0;
main.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; main.classList.add('dragging'); });
main.addEventListener('dragover', (e) => e.preventDefault());
main.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; main.classList.remove('dragging'); } });
main.addEventListener('drop', (e) => { e.preventDefault(); dragDepth = 0; main.classList.remove('dragging'); openFile(e.dataTransfer.files[0]); });

/* ---------- toolbar ---------- */
$('fit').addEventListener('click', fit);
$('edges').addEventListener('click', () => {
  showEdges = !showEdges; $('edges').setAttribute('aria-pressed', String(showEdges));
  for (const p of parts) p.lines.visible = showEdges; draw();
});

applyTheme(); resize();
</script>
</body>
</html>
