<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CadSkill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  /* Layout: the model fills the page. A wordmark and a readout sit in the top corners, one dock at the bottom.
     The history opens from the dock as a floating panel on the left.
     There are no modelling controls: Claude changes the model, this page shows it. */
  :root {
    --paper: #e9edf1;
    --panel: #f7f9fa;
    --ink: #17212b;
    --muted: #586573;
    --rule: #cfd7df;
    --accent: #1b5fc9;
    --accent-ink: #ffffff;
    --model: #8d9aa8;
    --bad: #b3261e;
    --display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #11161b;
      --panel: #19212a;
      --ink: #e4eaf0;
      --muted: #94a2b0;
      --rule: #2b3642;
      --accent: #6ea8ff;
      --accent-ink: #0b1420;
      --model: #9aa8b6;
      --bad: #ff8a80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #11161b;
    --panel: #19212a;
    --ink: #e4eaf0;
    --muted: #94a2b0;
    --rule: #2b3642;
    --accent: #6ea8ff;
    --accent-ink: #0b1420;
    --model: #9aa8b6;
    --bad: #ff8a80;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; min-height: 480px; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.45 var(--body);
    overflow: hidden;
  }
  button {
    font: 500 13px/1 var(--body);
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 8px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  /* The model fills the page; everything else floats over it. */
  main { position: fixed; inset: 0; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  h1 {
    position: absolute; left: 24px; top: 24px; margin: 0;
    font: 600 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    pointer-events: none;
  }
  #readout {
    position: absolute; right: 24px; top: 22px; max-width: min(60vw, 520px);
    text-align: right; font: 400 12px/1.6 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted);
    overflow-wrap: anywhere; pointer-events: none;
  }
  #r-size { color: var(--ink); }

  #dock {
    z-index: 4;
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    max-width: calc(100vw - 32px);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px;
    padding: 8px 8px 8px 16px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
  }
  .part { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .chip { width: 10px; height: 10px; border-radius: 2px; flex: none; background: var(--model); border: 1px solid var(--rule); }
  #name { font: 400 13px/1.2 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
  .sep { width: 1px; height: 20px; background: var(--rule); }
  .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

  #status {
    z-index: 2;
    position: absolute; left: 16px; right: 16px; bottom: 96px;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px;
    font: 400 12px/1.4 var(--mono); color: var(--muted);
    pointer-events: none;
  }
  #status .msg { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 10px; }
  #status .msg.bad { color: var(--bad); border-color: var(--bad); }
  [hidden] { display: none !important; }

  /* History: closed until asked for, so the model keeps the window. */
  #history, #steps-panel {
    z-index: 3;
    position: absolute; left: 24px; top: 56px; width: 288px; max-width: calc(100vw - 32px);
    max-height: calc(100% - 56px - 112px);
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
  }
  #history h2, #steps-panel h2 {
    display: flex; align-items: center; gap: 8px; margin: 0; padding: 8px 8px 8px 16px;
    font: 600 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--rule);
  }
  #count, #step-count { font: 400 12px/1 var(--mono); letter-spacing: 0; flex: 1; }
  #close-history, #close-steps { border-color: transparent; color: var(--muted); padding: 6px 8px; font-size: 15px; }
  #close-history:hover, #close-steps:hover { color: var(--ink); border-color: var(--rule); }
  #versions, #steps-list { list-style: none; margin: 0; padding: 8px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 2px; }
  #steps-source { padding: 10px 16px 0; font: 400 11px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  #steps-shape-label { padding: 10px 16px; display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
  #steps-shape { width: 100%; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 5px; }
  #steps-message { margin: 0; padding: 10px 16px; font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  #steps-message.bad { color: var(--bad); }
  .build-step { font: 400 11px/1.5 var(--mono); overflow-wrap: anywhere; }
  .hint { color: var(--muted); font-size: 13px; padding: 8px; }
  .ver {
    display: flex; flex-direction: column; align-items: stretch; gap: 4px; width: 100%;
    text-align: left; white-space: normal; line-height: 1.35; padding: 8px 10px; border-color: transparent;
  }
  .ver:hover { border-color: var(--rule); }
  .ver[aria-current="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .vhead { display: flex; align-items: baseline; gap: 8px; }
  .vhead b { font: 500 13px/1 var(--mono); }
  .vhead time { margin-left: auto; font: 400 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .tag { font: 500 11px/1 var(--body); color: var(--accent); }
  .vnote { font-size: 13px; overflow-wrap: anywhere; }
  .vsum {
    font: 400 12px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  @media (max-width: 720px) {
    .sep { display: none; }
    #dock { bottom: 16px; padding: 8px; }
    #status { bottom: 124px; }
    #history, #steps-panel { left: 16px; top: 48px; max-height: calc(100% - 48px - 150px); }
  }
</style>
</head>
<body>
<main id="main">
  <div id="stage"></div>
  <h1>CadSkill</h1>
  <div id="readout" aria-live="polite"><div id="r-size">&nbsp;</div><div id="r-meta">&nbsp;</div></div>
  <div id="status"><span class="msg" id="msg">Waiting for a model</span></div>
  <section id="steps-panel" aria-label="Build steps" hidden>
    <h2>Build steps <span id="step-count"></span><button type="button" id="close-steps" aria-label="Close build steps">×</button></h2>
    <div id="steps-source"></div>
    <label id="steps-shape-label" hidden>Shape<select id="steps-shape"></select></label>
    <p id="steps-message" role="status" hidden></p>
    <ol id="steps-list"></ol>
  </section>
  <section id="history" aria-label="Revisions" hidden>
    <h2>Revisions <span id="count"></span><button type="button" id="close-history" aria-label="Close revisions">×</button></h2>
    <ol id="versions"></ol>
  </section>
  <div id="dock">
    <div class="part"><span class="chip" id="chip"></span><span id="name">Model</span></div>
    <span class="sep"></span>
    <div class="tools">
      <button type="button" id="back" hidden>Back to latest</button>
      <button type="button" id="show-model" hidden>Final model</button>
      <button type="button" id="toggle-history" aria-pressed="false" aria-controls="history">Revisions</button>
      <button type="button" id="build-steps" aria-pressed="false" aria-controls="steps-panel" hidden disabled>Build steps</button>
    </div>
  </div>
</main>

<script type="module" src="./ui/app.js"></script>
</body>
</html>
