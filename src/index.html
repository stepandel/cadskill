<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  /* Layout: the model fills the page. A wordmark and a readout sit in the top corners, one dock of controls at the bottom.
     The history opens from the dock as a floating panel on the left. */
  :root {
    --paper: #e9edf1;
    --panel: #f7f9fa;
    --ink: #17212b;
    --muted: #586573;
    --rule: #cfd7df;
    --accent: #1b5fc9;
    --accent-ink: #ffffff;
    --model: #8d9aa8;
    --bad: #b3261e;
    --display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #11161b;
      --panel: #19212a;
      --ink: #e4eaf0;
      --muted: #94a2b0;
      --rule: #2b3642;
      --accent: #6ea8ff;
      --accent-ink: #0b1420;
      --model: #9aa8b6;
      --bad: #ff8a80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #11161b;
    --panel: #19212a;
    --ink: #e4eaf0;
    --muted: #94a2b0;
    --rule: #2b3642;
    --accent: #6ea8ff;
    --accent-ink: #0b1420;
    --model: #9aa8b6;
    --bad: #ff8a80;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.45 var(--body);
    overflow: hidden;
  }
  button, .filebtn {
    font: 500 13px/1 var(--body);
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 8px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover, .filebtn:hover { border-color: var(--accent); }
  button:focus-visible, .filebtn:focus-within, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .filebtn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); position: relative; display: inline-block; }
  .filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  button:disabled { opacity: 0.5; cursor: default; }

  /* The model fills the page; everything else floats over it. */
  main { position: fixed; inset: 0; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  h1 {
    position: absolute; left: 24px; top: 24px; margin: 0;
    font: 600 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    pointer-events: none;
  }
  #readout {
    position: absolute; right: 24px; top: 22px; max-width: min(60vw, 520px);
    text-align: right; font: 400 12px/1.6 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted);
    overflow-wrap: anywhere; pointer-events: none;
  }
  #r-size { color: var(--ink); }

  #dock {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    max-width: calc(100vw - 32px);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px;
    padding: 8px 8px 8px 16px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
  }
  .part { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .chip { width: 10px; height: 10px; border-radius: 2px; flex: none; background: var(--model); border: 1px solid var(--rule); }
  #name { font: 400 13px/1.2 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
  .sep { width: 1px; height: 20px; background: var(--rule); }
  .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

  /* History: closed until asked for, so the model keeps the window. */
  #history {
    position: absolute; left: 24px; top: 56px; width: 288px; max-width: calc(100vw - 32px);
    max-height: calc(100% - 56px - 112px); overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px; padding: 16px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
  }
  #history h2 {
    font: 600 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  #history h2 span { font: 400 12px/1 var(--mono); letter-spacing: 0; text-transform: none; }
  #history .tools { justify-content: flex-start; }
  #history .tools button { padding: 6px 8px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  #steps { display: flex; flex-direction: column; gap: 12px; }
  #steps:empty { display: none; }
  .step { display: flex; flex-direction: column; gap: 8px; }
  .step.off { opacity: 0.45; }
  .stephead { display: flex; align-items: center; gap: 8px; }
  .stephead b { flex: 1; font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
  .stephead button { padding: 4px 0; min-width: 26px; font: 500 12px/1 var(--mono); }
  .stephead .del { border-color: transparent; color: var(--muted); font-size: 15px; }
  .stephead .del:hover { color: var(--bad); border-color: var(--bad); }
  .step.bad .stephead b, .steperr { color: var(--bad); }
  .steperr { margin: 0; font-size: 13px; }
  .param { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: baseline; }
  .param label { font-size: 13px; }
  .param output { font: 500 13px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .param input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; }

  #status {
    position: absolute; left: 16px; right: 16px; bottom: 96px;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px;
    font: 400 12px/1.4 var(--mono); color: var(--muted);
    pointer-events: none;
  }
  #status .msg { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 10px; }
  #status .msg.bad { color: var(--bad); border-color: var(--bad); }
  #meter { width: 160px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
  #meter i { display: block; height: 100%; width: 0; background: var(--accent); }
  #drop {
    position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: 8px;
    display: none; align-items: center; justify-content: center;
    font: 600 16px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);
    background: color-mix(in srgb, var(--paper) 80%, transparent);
    pointer-events: none;
  }
  main.dragging #drop { display: flex; }
  [hidden] { display: none !important; }

  @media (max-width: 720px) {
    .sep { display: none; }
    #dock { bottom: 16px; padding: 8px; }
    #status { bottom: 124px; }
    #history { left: 16px; top: 48px; max-height: calc(100% - 48px - 150px); }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
</head>
<body>
<main id="main">
  <div id="stage"></div>
  <h1>CAD Bench</h1>
  <div id="readout" aria-live="polite"><div id="r-size">&nbsp;</div><div id="r-meta">&nbsp;</div></div>
  <section id="history" aria-label="History" hidden>
    <h2>History <span id="saved"></span></h2>
    <div class="tools">
      <button type="button" id="undo" disabled>Undo</button>
      <button type="button" id="redo" disabled>Redo</button>
      <button type="button" id="sample">Sample part</button>
    </div>
    <div id="steps"></div>
    <div class="tools" id="add">
      <button type="button" data-op="box">+ Box</button>
      <button type="button" data-op="cylinder">+ Cylinder</button>
      <button type="button" data-op="hole">+ Hole</button>
      <button type="button" data-op="fillet">+ Round corners</button>
      <button type="button" data-op="move">+ Move</button>
    </div>
    <p class="hint">The model is rebuilt from these steps, in order. Click a step's number to roll back to it. Hole, Round corners and Move apply to the selected part.</p>
  </section>
  <div id="drop">Drop a STEP file to open it</div>
  <div id="status"><span class="msg" id="msg">Loading the geometry kernel</span><span id="meter"><i></i></span></div>
  <div id="dock">
    <div class="part"><span class="chip" id="chip"></span><span id="name">Sample part</span></div>
    <span class="sep"></span>
    <div class="tools">
      <button type="button" id="fit">Fit view</button>
      <button type="button" id="edges" aria-pressed="true">Edges</button>
      <button type="button" id="toggle-history" aria-pressed="false" aria-controls="history">History</button>
      <label class="filebtn">Open STEP file<input type="file" id="file" accept=".step,.stp,.STEP,.STP"></label>
    </div>
  </div>
</main>

<script type="module" src="./ui/app.js"></script>
</body>
</html>
