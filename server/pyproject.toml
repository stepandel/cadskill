[project]
name = "cadskill"
version = "0.1.2"
description = "3D CAD for Claude and Codex: build, inspect and export solid models by writing CadQuery scripts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = ["cad", "cadquery", "claude", "codex", "mcp", "3d", "step", "stl"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "cadquery>=2.5,<3",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
replay = ["jupyter-cadquery>=5.3,<6", "voila>=0.5.8,<0.6"]

[project.urls]
Homepage = "https://github.com/stepandel/cadskill"
Source = "https://github.com/stepandel/cadskill"

[project.scripts]
cadskill = "cadskill_mcp.cli:main"
cadskill-mcp = "cadskill_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadskill_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
