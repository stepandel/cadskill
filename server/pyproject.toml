[project]
name = "caddraft-mcp"
version = "0.1.0"
description = "MCP server that lets Claude build, inspect and export CAD models by writing CadQuery scripts."
requires-python = ">=3.12,<3.13"
dependencies = [
  "cadquery>=2.5,<3",
  "mcp>=1.12,<2",
]

[project.scripts]
caddraft = "caddraft_mcp.cli:main"
caddraft-mcp = "caddraft_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caddraft_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
